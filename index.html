<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BusyBuddy.Toys — Under Construction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="BusyBuddy.Toys — Our website is under construction. A calm, playful landing page with live launch progress."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Geologica font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global styles -->
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- React & ReactDOM (UMD builds) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>

    <!-- Three.js for 3D animations and shaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Babel for JSX transformation in the browser (sufficient for this single landing page) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- React components & entry point (compiled by Babel in the browser) -->
    <script
      type="text/babel"
      data-presets="env,react"
      src="/src/ThreeScene.jsx"
    ></script>
    <script
      type="text/babel"
      data-presets="env,react"
      src="/src/App.jsx"
    ></script>
    <script
      type="text/babel"
      data-presets="env,react"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
